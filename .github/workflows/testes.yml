# .github/workflows/testes.yml
# TAS Cidade Conectada · ADS033 · Capítulos 8, 9 e 10

name: testes

on:
  push:
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'          # 03h em Recife (o cron do GitHub é UTC)
  workflow_dispatch:             # execução manual: essencial no laboratório

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.19.0'
  SUT_REPO: 'HayCESAR/sut-didatico'
  SUT_REF: 'main'
  PORT: '3000'
  BASE_URL: 'http://localhost:3000'
  MAESTRO_VERSION: '2.9.0'

jobs:

  # ===================================================================
  # ESTÁGIOS 1 e 2: build, unidade e API.  Gate G1: bloqueia o merge.
  # Juntos no mesmo job porque separá-los custaria uma preparação a mais.
  # ===================================================================
  rapido:
    name: 'estagios 1 e 2: build, unidade e API'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------- C1: código presente ----------
      - name: checkout da TAS
        uses: actions/checkout@v4
        with:
          path: tas

      - name: checkout do SUT didatico
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPO }}
          ref: ${{ env.SUT_REF }}
          path: sut-didatico
          # Se o repositório do SUT for privado, descomente e crie o segredo:
          # token: ${{ secrets.TOKEN_SUT }}

      # ---------- C2: dependências ----------
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # SEM `cache: npm`: nenhum dos dois projetos tem package-lock.json,
          # e o setup-node falha com "Dependencies lock file is not found".
          # Quando a primeira dependência entrar, versione o lockfile e troque por:
          #   cache: npm
          #   cache-dependency-path: |
          #     tas/package-lock.json
          #     sut-didatico/package-lock.json

      - name: declara as versoes em uso
        run: |
          node --version
          npm --version
          echo "TAS: $(git -C tas rev-parse --short HEAD)"
          echo "SUT: $(git -C sut-didatico rev-parse --short HEAD)"

      # Hoje nenhum dos projetos tem dependências externas, então não há
      # `npm ci`. Isso é uma propriedade do estado atual, não uma decisão:
      # na primeira dependência instalada, `npm ci` volta para cá.

      # ---------- ESTÁGIO 1: o gate mais barato, antes de qualquer servidor ----------
      # Os testes de unidade não precisam do servidor no ar, mas precisam do
      # ARQUIVO regras-status.js, que veio no checkout acima.
      - name: verificacao de configuracao da TAS
        run: |
          set -e
          test -f sut-didatico/regras-status.js || { echo "::error::regras-status.js ausente: o checkout do SUT falhou"; exit 1; }
          test -f sut-didatico/server.js        || { echo "::error::server.js ausente"; exit 1; }
          test -d tas/tests/unidade && test -d tas/tests/api
          echo "estrutura esperada confirmada"

      - name: testes de unidade
        id: unidade
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/unidade.xml \
            "tests/unidade/**/*.test.js"

      # ---------- C5: SUT disponível ----------
      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: |
          nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/sut.pid"
          echo "processo do SUT: $(cat "$GITHUB_WORKSPACE/sut.pid")"

      # Sonda de prontidão. Sem `sleep` e sem `npx wait-on`:
      # - `sleep` é lento quando o SUT sobe rápido e insuficiente quando demora,
      #   e é a receita conhecida para teste intermitente;
      # - `npx wait-on` baixaria um pacote não fixado a cada execução.
      # O SUT didático não tem /api/v1/health, então a prova de vida é o 401 de
      # /api/v1/demands sem token. (Este é, na prática, o pedido de testabilidade
      # que a squad precisa fazer ao backend real.)
      - name: aguarda o SUT responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "SUT respondeu em ${i}s (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::SUT nao respondeu em 60s"
          echo "----- ultimas linhas do log do SUT -----"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || echo "(log vazio: o processo nem iniciou)"
          exit 1

      # ---------- ESTÁGIO 2: suíte de API ----------
      - name: estado inicial conhecido
        run: |
          curl -s -X POST "$BASE_URL/api/v1/_test/reset" -o /dev/null -w 'reset: %{http_code}\n'

      - name: suite de API
        id: api
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/api.xml \
            "tests/api/**/*.test.js"

      # ---------- Diagnóstico e evidências ----------
      - name: diagnostico pos-falha
        if: failure()
        run: |
          {
            echo "### Diagnostico"
            echo ""
            echo "Health apos a falha (401 ou 200 = SUT de pe): \`$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || echo 'sem resposta')\`"
            echo ""
            echo '```'
            tail -n 80 "$GITHUB_WORKSPACE/sut.log" 2>/dev/null || echo "(sem log do SUT)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: resumo dos estagios
        if: always()
        run: |
          {
            echo "## Estagios 1 e 2"
            echo ""
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| unidade | ${{ steps.unidade.outcome }} |"
            echo "| api | ${{ steps.api.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publica evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-rapido-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
          retention-days: 14
          if-no-files-found: warn

  # ===================================================================
  # ESTÁGIO 3: smoke E2E (Maestro, fluxos web contra /web do SUT).
  #
  # NÃO roda em todo PR, por decisão: E2E de interface é lento e mais frágil
  # que a suíte de API, e o Capítulo 8 separou os perfis de confiabilidade.
  # Dispare com o rótulo `rodar-e2e` no PR, ou manualmente.
  #
  # ATENÇÃO: o suporte web do Maestro muda com frequência. Valide estes passos
  # localmente antes de tratar este job como gate de qualquer coisa.
  # ===================================================================
  e2e:
    name: 'estagio 3: smoke E2E'
    needs: rapido                       # falhar cedo economiza esteira
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'rodar-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout da TAS
        uses: actions/checkout@v4
        with:
          path: tas

      - name: checkout do SUT didatico
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPO }}
          ref: ${{ env.SUT_REF }}
          path: sut-didatico

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda a UI web responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/web" || true)
            if [ "$code" = "200" ]; then echo "UI web no ar em ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::UI web nao respondeu em 60s"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || true
          exit 1

      - name: instala o Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION="$MAESTRO_VERSION" bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: versao do Maestro
        run: maestro --version

      - name: estado inicial conhecido
        run: curl -s -X POST "$BASE_URL/api/v1/_test/reset" -o /dev/null

      - name: fluxos de smoke
        working-directory: tas
        run: |
          mkdir -p relatorios
          maestro test tests/e2e/maestro \
            --include-tags smoke \
            --format junit \
            --output relatorios/maestro-junit.xml

      - name: publica evidencias do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
            ~/.maestro/tests/
          retention-days: 14
          if-no-files-found: warn

  # ===================================================================
  # ESTÁGIO 4: regressão completa, noturna.
  # Gate G3: não bloqueia nada, abre item de manutenção em caso de falha.
  # ===================================================================
  regressao:
    name: 'estagio 4: regressao completa'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: checkout da TAS
        uses: actions/checkout@v4
        with:
          path: tas

      - name: checkout do SUT didatico
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUT_REPO }}
          ref: ${{ env.SUT_REF }}
          path: sut-didatico

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda o SUT responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::SUT nao respondeu em 60s"; tail -n 50 "$GITHUB_WORKSPACE/sut.log" || true; exit 1

      - name: suite completa
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/regressao.xml \
            "tests/**/*.test.js"

      - name: publica evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-regressao-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
          retention-days: 30

      - name: abre item de manutencao
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Regressao noturna reprovou em $(date +%F)" \
            --body "Execucao: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label manutencao