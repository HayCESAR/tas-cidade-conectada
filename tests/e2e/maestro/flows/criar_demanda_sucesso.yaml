url: http://localhost:3000/web
name: Criar demanda com sucesso
tags:
  - smoke
  - demanda
---
- launchApp
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ana@exemplo.com
      SENHA: senha123
- tapOn:
    id: "campo-descricao"
- inputText: "Buraco grande na pista sentido bairro Macaxeira, proximo ao numero 450."
- scrollUntilVisible:
    element:
      id: "botao-enviar"
- tapOn:
    id: "botao-enviar"
- assertVisible: "Demanda registrada."
- assertVisible: "Protocolo DEM-.*"
